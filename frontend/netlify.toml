# Netlify configuration for the built SPA.
#
# Site settings in the Netlify UI: base directory = `frontend`
# (Netlify then reads this file; no other build settings are needed).
#
# Full walkthrough: docs/deployment-free.md

[build]
  command = "npm run build"
  publish = "dist"

# Same-origin API proxy. The browser only ever talks to the Netlify domain,
# so the Secure/SameSite=Lax session cookie and the CSRF double-submit cookie
# keep working exactly as audited — no application code changes.
#
# Proxies to the Render service defined in render.yaml
# (https://college-attendance-api.onrender.com). If that service's URL ever
# changes, update the host here. Rules are applied top-to-bottom.
[[redirects]]
  from = "/api/*"
  to = "https://college-attendance-api.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routing: unknown paths fall back to the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
